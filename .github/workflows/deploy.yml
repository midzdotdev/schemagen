name: Deploy

# Production on push to main; preview deployment per PR. Cloudflare Pages
# auto-aliases preview deployments by branch name, so each PR head gets a
# stable URL that updates as commits land on the branch.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN  — Cloudflare token with "Account → Cloudflare Pages → Edit"
#   CLOUDFLARE_ACCOUNT_ID — find in any URL in dash.cloudflare.com
#
# The Pages project is created on first deploy (wrangler 3+).

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch — saves CI time when a PR is
# updated mid-build, and prevents preview deploys from racing.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # wrangler-action writes a GitHub Deployment so the URL surfaces in the
      # Deployments tab + the PR sidebar.
      deployments: write
      # For the preview-URL comment on PRs.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Core has to build first — web's typecheck resolves its declarations.
      - run: pnpm --filter @schemagen/core build
      - run: pnpm --filter @schemagen/web build

      - id: pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/web/dist --project-name=schemagen
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cloudflare-pages-preview
          message: |
            ### 🚀 Cloudflare Pages preview

            - **Deployment**: ${{ steps.pages.outputs.deployment-url }}
            - **Branch alias** (stable across new commits): ${{ steps.pages.outputs.pages-deployment-alias-url }}
            - Commit: `${{ github.event.pull_request.head.sha }}`
