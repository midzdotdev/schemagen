name: CI

on:
  # Every PR (any base branch) gets exactly one run via `pull_request`. `push` is scoped to
  # long-lived branches only — also running it on PR head branches would fire a second,
  # duplicate run for every PR (the push event and the pull_request event are separate).
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json's `packageManager` field; pinning it here too makes
      # pnpm/action-setup@v4 abort with ERR_PNPM_BAD_PM_VERSION ("multiple versions specified").
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build core first so @schemagen/web's typecheck/test can resolve its declarations.
      - run: pnpm --filter @schemagen/core build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @schemagen/web build
